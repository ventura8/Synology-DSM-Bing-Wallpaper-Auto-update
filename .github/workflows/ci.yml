---
name: CI Pipeline

"on":
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install quality dependencies
        run: |
          # Hash-pinned lock, wheels only: every version is fixed down to the transitive
          # dependencies, and an sdist would run setup.py at install time.
          python -m pip install --upgrade --only-binary :all: --require-hashes -r requirements/dev.lock
      - name: Install PowerShell analyzer
        run: |
          pwsh -NoProfile -Command \
            'Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery'
      - name: Run mandatory quality checks
        run: bash scripts/quality/quality_check.sh

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    # Runs last: the scan uploads the merged kcov coverage, so it needs that job's artifact.
    needs: coverage-report
    # Until SONAR_TOKEN exists this job is a no-op and the project relies on
    # SonarQube Cloud Automatic Analysis. Adding the secret means you have
    # switched to CI-based analysis - turn Automatic Analysis OFF in the
    # project's settings at the same time, or every scan here fails.
    if: vars.SONAR_ENABLED == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history to attribute new code to the right commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Download Merged Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cobertura-xml
      - name: Convert Coverage For Sonar
        run: python3 tests/cobertura_to_sonar.py cobertura.xml coverage-sonar.xml
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Enforce SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Test Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile.dsm_mock
          load: true
          tags: dsm-mock
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run tests directly on script to ensure coverage capture.
      - name: Execute Unit Tests
        run: |
          mkdir -p raw_coverage
          chmod 755 raw_coverage
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v "$PWD/raw_coverage:/app/coverage" \
            dsm-mock bash -c "./run_kcov_cases.sh unit /app/coverage"

      - name: Upload Raw Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-coverage-unit
          path: raw_coverage/
          include-hidden-files: true

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Test Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile.dsm_mock
          load: true
          tags: dsm-mock
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Component Tests
        run: |
          mkdir -p raw_coverage_comp
          chmod 755 raw_coverage_comp
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v "$PWD/raw_coverage_comp:/app/coverage" \
            dsm-mock bash -c "./run_kcov_cases.sh component /app/coverage"

      - name: Upload Component Raw Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-coverage-comp
          path: raw_coverage_comp/
          include-hidden-files: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Test Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile.dsm_mock
          load: true
          tags: dsm-mock
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute E2E Tests
        run: |
          mkdir -p raw_coverage_e2e
          chmod 755 raw_coverage_e2e
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v "$PWD/raw_coverage_e2e:/app/coverage" \
            dsm-mock bash -c "./run_kcov_cases.sh e2e /app/coverage"

      - name: Upload E2E Raw Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-coverage-e2e
          path: raw_coverage_e2e/
          include-hidden-files: true

  coverage-report:
    name: Merge & Publish Report
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests, e2e-tests]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Test Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile.dsm_mock
          load: true
          tags: dsm-mock
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download Unit Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-coverage-unit
          path: coverage_inputs/unit

      - name: Download Component Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-coverage-comp
          path: coverage_inputs/comp

      - name: Download E2E Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-coverage-e2e
          path: coverage_inputs/e2e

      - name: Merge Coverage Reports
        run: |
          mkdir -p coverage
          chmod 755 coverage

          # Find all directories that contain coverage.db and merge them
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v "$PWD:/workdir" \
            -w /workdir \
            dsm-mock bash -c "\
              mapfile -t dirs < <(find coverage_inputs -name coverage.db -exec dirname {} \;) \
              && kcov --merge coverage \"\${dirs[@]}\""

      - name: Detailed Per-File Summary
        run: |
            # Find the cobertura file in the output
            FOUND_XML=$(find coverage -name "cobertura.xml" | head -n 1)
            if [ -f "$FOUND_XML" ]; then
                cp "$FOUND_XML" cobertura.xml
                # Transform XML (split packages by class) for CodeCoverageSummary structure compatibility
                python3 tests/transform_coverage.py cobertura.xml
                python3 tests/generate_detailed_coverage.py cobertura.xml
            else
                echo "Coverage XML not found."
                exit 1
            fi

      - name: Generate Coverage Summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: cobertura.xml
          badge: false
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '90 95'

      - name: Enforce Coverage Threshold
        run: python3 scripts/coverage_checks/check_coverage_threshold.py cobertura.xml 90

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Publish Summary to Job
        run: |
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Append Detailed Coverage to Job Summary
        run: python3 tests/generate_detailed_coverage.py cobertura.xml

      - name: Prepare HTML Report
        run: |
          mkdir -p html_report
          # Find index.html
          FOUND_INDEX=$(find coverage -name "index.html" | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
             FOUND_DIR=$(dirname "$FOUND_INDEX")
             cp -r "$FOUND_DIR/." html_report/
          fi

      - name: Upload Merged Coverage XML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-xml
          path: cobertura.xml

      - name: Upload HTML Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: html_report/
