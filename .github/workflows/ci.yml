---
name: CI Pipeline

"on":
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
      - name: Install PowerShell analyzer
        run: |
          pwsh -NoProfile -Command "Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -Repository PSGallery"
      - name: Run mandatory quality checks
        run: bash scripts/quality/quality_check.sh

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build Test Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: tests/Dockerfile.dsm_mock
          load: true
          tags: dsm-mock
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run tests directly on script to ensure coverage capture.
      - name: Execute Unit Tests
        run: |
          mkdir -p raw_coverage
          chmod 777 raw_coverage
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v "$PWD/raw_coverage:/app/coverage" \
            dsm-mock bash -c "./run_kcov_cases.sh unit /app/coverage"

      - name: Upload Raw Coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: raw-coverage-unit
          path: raw_coverage/
          include-hidden-files: true

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build Test Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: tests/Dockerfile.dsm_mock
          load: true
          tags: dsm-mock
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Component Tests
        run: |
          mkdir -p raw_coverage_comp
          chmod 777 raw_coverage_comp
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v "$PWD/raw_coverage_comp:/app/coverage" \
            dsm-mock bash -c "./run_kcov_cases.sh component /app/coverage"

      - name: Upload Component Raw Coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: raw-coverage-comp
          path: raw_coverage_comp/
          include-hidden-files: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build Test Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: tests/Dockerfile.dsm_mock
          load: true
          tags: dsm-mock
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute E2E Tests
        run: |
          mkdir -p raw_coverage_e2e
          chmod 777 raw_coverage_e2e
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v "$PWD/raw_coverage_e2e:/app/coverage" \
            dsm-mock bash -c "./run_kcov_cases.sh e2e /app/coverage"

      - name: Upload E2E Raw Coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: raw-coverage-e2e
          path: raw_coverage_e2e/
          include-hidden-files: true

  coverage-report:
    name: Merge & Publish Report
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests, e2e-tests]
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build Test Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: tests/Dockerfile.dsm_mock
          load: true
          tags: dsm-mock
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download Unit Coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: raw-coverage-unit
          path: coverage_inputs/unit

      - name: Download Component Coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: raw-coverage-comp
          path: coverage_inputs/comp

      - name: Download E2E Coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: raw-coverage-e2e
          path: coverage_inputs/e2e

      - name: Merge Coverage Reports
        run: |
          mkdir -p coverage
          chmod 777 coverage

          # Find all directories that contain coverage.db and merge them
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v "$PWD:/workdir" \
            -w /workdir \
            dsm-mock bash -c "\
              mapfile -t dirs < <(find coverage_inputs -name coverage.db -exec dirname {} \;) \
              && kcov --merge coverage \"\${dirs[@]}\""

      - name: Detailed Per-File Summary
        run: |
            # Find the cobertura file in the output
            FOUND_XML=$(find coverage -name "cobertura.xml" | head -n 1)
            if [ -f "$FOUND_XML" ]; then
                cp "$FOUND_XML" cobertura.xml
                # Transform XML (split packages by class) for CodeCoverageSummary structure compatibility
                python3 tests/transform_coverage.py cobertura.xml
                python3 tests/generate_detailed_coverage.py cobertura.xml
            else
                echo "Coverage XML not found."
                exit 1
            fi

      - name: Generate Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          badge: false
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '90 95'

      - name: Enforce Coverage Threshold
        run: python3 scripts/coverage_checks/check_coverage_threshold.py cobertura.xml 90

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Publish Summary to Job
        run: |
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Append Detailed Coverage to Job Summary
        run: python3 tests/generate_detailed_coverage.py cobertura.xml

      - name: Prepare HTML Report
        run: |
          mkdir -p html_report
          # Find index.html
          FOUND_INDEX=$(find coverage -name "index.html" | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
             FOUND_DIR=$(dirname "$FOUND_INDEX")
             cp -r "$FOUND_DIR/." html_report/
          fi

      - name: Upload HTML Report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: html_report/
