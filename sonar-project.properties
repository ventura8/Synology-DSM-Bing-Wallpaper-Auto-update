# SonarQube Cloud configuration (SSOT for local scans and CI).
# Local: ./scripts/quality/sonar_scan.sh   CI: .github/workflows/ci.yml (sonarqube job)
sonar.organization=ventura8
sonar.projectKey=ventura8_Synology-DSM-Bing-Wallpaper-Auto-update
sonar.projectName=Synology-DSM-Bing-Wallpaper-Auto-update

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.tests=tests

# kcov coverage, restated in Sonar's generic format by tests/cobertura_to_sonar.py.
# Written by the CI sonarqube job; absent on a local scan, which Sonar tolerates.
sonar.coverageReportPaths=coverage-sonar.xml

# Generated/vendored trees never contain reviewable source. tests/** is listed here because
# sonar.sources=. would otherwise index it a second time as main source and fail the scan -
# sonar.exclusions filters main sources only, so the tree is still analysed as sonar.tests.
sonar.exclusions=coverage/**,coverage_inputs/**,coverage_final/**,raw_coverage*/**,html_report/**,reports/**,assets/**,.venv/**,.mypy_cache/**,.ruff_cache/**,.pre-commit-cache/**,tests/**
