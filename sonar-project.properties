# SonarQube Cloud configuration (SSOT for local scans and CI).
# Local: ./scripts/quality/sonar_scan.sh   CI: .github/workflows/ci.yml (sonarqube job)
sonar.organization=ventura8
sonar.projectKey=ventura8_Synology-DSM-Bing-Wallpaper-Auto-update
sonar.projectName=Synology-DSM-Bing-Wallpaper-Auto-update

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.tests=tests

# Generated/vendored trees never contain reviewable source.
sonar.exclusions=coverage/**,coverage_inputs/**,coverage_final/**,raw_coverage*/**,html_report/**,reports/**,assets/**,.venv/**,.mypy_cache/**,.ruff_cache/**,.pre-commit-cache/**
